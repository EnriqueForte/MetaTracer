# MetaTracer CI guardrail (TASK-16, v2.2)
#
# Dos niveles, sin secretos ni servicios de contenedor (la suite es 100% local:
# el e2e corre contra un mock uvicorn en 127.0.0.1 efímero):
#
#   pr   -> barrera rápida por pull request: ruff + suite "not e2e".
#   main -> suite COMPLETA (incluye e2e) + cobertura >= 85% combinada
#           (core/detectors/extractors/reports, DoD TASK-07). Requiere "pr".
#
# Supply chain (threat 15): todas las acciones fijadas por SHA completo.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pr:
    name: PR guardrail (ruff + fast suite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project with dev extras
        run: pip install '.[dev]'
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Fast suite (no e2e)
        run: python -m pytest -m 'not e2e' -q

  main:
    name: Full suite + coverage (>= 85%)
    runs-on: ubuntu-latest
    needs: pr
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project with dev extras
        run: pip install '.[dev]'
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Full suite incl. e2e
        # El e2e activa allow_loopback EN PROCESO (Settings(allow_loopback=True)),
        # no requiere METATRACER_ALLOW_LOOPBACK en el entorno.
        run: python -m pytest -q
      - name: Coverage >= 85% (core/detectors/extractors/reports)
        run: |
          python -m pytest \
            --cov=metatracer.core \
            --cov=metatracer.detectors \
            --cov=metatracer.extractors \
            --cov=metatracer.reports \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85 \
            -m 'not e2e' -q
      - name: Coverage artifacts present
        # Diagnostic + guard: the gate above writes .coverage and coverage.xml
        # in the workspace root. If this step ever fails, the upload would have
        # warned silently (T14).
        run: |
          ls -la .coverage coverage.xml
          python -c "import os; print('coverage file:', os.path.getsize('.coverage'), 'bytes')"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-and-reports
          path: |
            .coverage
            coverage.xml
            reports/
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: Dependency audit (pip-audit, advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      # Advisory, not a gate. MetaTracer parses hostile files (PDF, EXIF, XMP),
      # so CVEs in pillow/pypdf are exactly our attack surface and should be
      # visible on every push. It does not fail the build because a CVE
      # published overnight would block unrelated work; bumping the pinned
      # version is a dependency change and needs the closed-list review
      # (threat 15). Audits requirements.lock: the exact set the image ships.
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.lock --progress-spinner off --format columns
        continue-on-error: true

  web:
    name: Web V2 (Vitest + Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install project (the contract check imports the API)
        # The generated client is derived from the live FastAPI schema, so the
        # check needs the app importable. No server is started.
        run: pip install '.[dev]'
      - name: Install web dependencies
        working-directory: web
        run: npm ci
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Contract drift (OpenAPI -> typescript)
        # Regenerates both halves and fails on any diff: a route or schema
        # change that does not ship its regenerated client is caught here
        # instead of surfacing as a runtime mismatch in the browser.
        run: |
          python spikes/web-v2-contract/export_openapi.py
          cd web && npm run generate:api && cd ..
          git diff --exit-code -- spikes/web-v2-contract/openapi.json web/src/lib/api/generated/schema.d.ts
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          METATRACER_API_ORIGIN: http://127.0.0.1:8765
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser test
        working-directory: web
        run: npm run test:e2e
        env:
          CI: "true"

  web-auth:
    name: Web V2 auth e2e (MIN-01 CSRF)
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project (API + CLI for the e2e auth server)
        run: pip install '.[dev]'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Production build (standalone server serves the auth pages)
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          METATRACER_API_ORIGIN: http://127.0.0.1:8000
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Auth e2e (real API, auth ON)
        working-directory: web
        run: npx playwright test --config=playwright.auth.config.ts
        env:
          CI: "true"
          METATRACER_AUTH_ENABLED: "true"
          METATRACER_AUTH_PASSWORD: "test-password-123"