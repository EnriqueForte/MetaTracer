[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metatracer"
version = "0.6.0"
description = "AI-powered sensitive metadata discovery for authorized bug bounty and red team engagements"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Closed dependency list (TASK-00, subtask 0.1.3). Do not add packages without
# explicit approval; any addition must update both this file and the task list.
# TASK-23 additions (approved 2026-09-17, platform v3.0 Eje B):
#   - asyncpg: PostgreSQL async driver (sqlite has a single writer; Eje B).
#   - alembic: schema migrations for PostgreSQL (init_db runs them to head).
#   - pgvector: SQLAlchemy/pgvector plumbing for the knowledge index (Eje B).
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.18",
    # SQLAlchemy's asyncio bridge (used by SQLModel's AsyncSession) needs
    # greenlet at import time. sqlmodel only declares plain SQLAlchemy, so a
    # clean `pip install .` (CI, a fresh venv) failed with
    # "SQLAlchemy asyncio module requires greenlet". It was already in
    # requirements.lock, which is why the Docker image worked and CI did not.
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=1.0",
    # Ceilings keep `pip install .` off the unapproved httpx2 fork
    # (langsmith 0.12+ and openai 3+ declare it). The image installs the lock.
    "httpx>=0.27.0,<1",
    "langsmith>=0.3.45,<0.12",
    "openai>=1.0,<3",
    # Security floor (2026-10-25): pip-audit reported 51 CVEs across 5 packages,
    # concentrated in the two libraries that parse hostile target files.
    # pillow 12.3.0 -> 13.0.0 and pypdf 6.19.0 -> 6.21.2 are the fixed floors.
    # Pillow 13 drops ExifTags.IFD.Makernote, which this project never used.
    "pillow>=13.0.0",
    "pypdf>=6.21.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# TASK-40: local MiniLM. Not in the default image / requirements.in.
onnx = [
    "onnxruntime>=1.17.0,<2",
    "tokenizers>=0.20.0,<1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "reportlab>=4.2",
    # JPEG fixture builder only. Not imported from src/ (TASK-32).
    "piexif>=1.1.3",
]

[project.scripts]
metatracer = "metatracer.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

# Versioned prompt artifacts loaded via importlib.resources (TASK-05).
[tool.setuptools.package-data]
"metatracer.agents.prompts" = ["*.md"]
# Packaged Alembic migrations (TASK-23): shipped so the runtime can run them
# programmatically on PostgreSQL backends.
"metatracer.db.migrations" = ["*.mako", "*.py"]
"metatracer.db.migrations.versions" = ["*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.isort]
# The tests/ tree is a namespace package (no __init__.py); declare it so its
# imports classify as first-party uniformly from tests/unit and tests/integration.
known-first-party = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates one long sa.Column(...) per column; hand-wrapping the
# generated migration invites merge conflicts on future autogenerations.
"src/metatracer/db/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Marks (TASK-07, subtask 7.2): tests/conftest.py auto-marks by directory
# (unit/ and agents/ -> unit, integration/ -> integration); the e2e module
# carries pytest.mark.e2e itself. Fast CI: pytest -m "not e2e"; full CI: all.
markers = [
    "unit: fast single-module tests (tests/unit, tests/agents with mocked LLM)",
    "integration: multi-module tests over faked transport or the loopback mock origin",
    "e2e: full pipeline over real loopback HTTP (needs METATRACER_ALLOW_LOOPBACK semantics)",
    "slow: tests too slow for the fast local loop",
]

[tool.coverage.run]
# DoD (TASK-07): >= 85% in metatracer.core / detectors / extractors / reports.
# Measure with: pytest --cov=metatracer.core --cov=metatracer.detectors \
#   --cov=metatracer.extractors --cov=metatracer.reports --cov-report=term-missing
source = ["src/metatracer"]

[tool.coverage.report]
# CI guardrail (TASK-16): umbral combinado de los 4 paquetes. Un solo lugar
# de verdad compartido por CI y por la ejecución local. Validado con 91% actual.
fail_under = 85
show_missing = true
exclude_also = [
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    '^\s*\.\.\.$',
]
