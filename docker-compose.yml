# MetaTracer local deployment (TASK-07, subtask 7.3.3): API + Web UI on :8000.
#
# METATRACER_ALLOW_LOOPBACK is a TEST-ONLY flag and is deliberately NOT set
# here — the container keeps the default safety posture (loopback/private
# targets blocked). Secrets arrive via the host environment, never baked in.
services:
  # Web V1 + JSON API (FastAPI). NOT published directly any more: the proxy is
  # the only public entrypoint, so the browser sees one origin (T10).
  web:
    build: .
    image: metatracer:0.6.0
    command: ["web"]
    expose:
      - "8000"
    environment:
      METATRACER_BIND_HOST: "0.0.0.0"
      METATRACER_LLM_API_KEY: "${METATRACER_LLM_API_KEY:-}"
      METATRACER_LLM_BASE_URL: "${METATRACER_LLM_BASE_URL:-}"
      METATRACER_LLM_MODEL: "${METATRACER_LLM_MODEL:-}"
      METATRACER_FAST_MODEL: "${METATRACER_FAST_MODEL:-}"
      METATRACER_LOG_LEVEL: "${METATRACER_LOG_LEVEL:-INFO}"
      # TASK-27: auth defaults ON because the service is reachable from the
      # proxy over the compose network. A .env that sets
      # METATRACER_AUTH_ENABLED=false makes the container exit unless
      # METATRACER_ALLOW_UNAUTHENTICATED_BIND=true (logged warning; not a
      # network-safety bypass).
      METATRACER_AUTH_ENABLED: "${METATRACER_AUTH_ENABLED:-true}"
      METATRACER_ALLOW_UNAUTHENTICATED_BIND: "${METATRACER_ALLOW_UNAUTHENTICATED_BIND:-false}"
      METATRACER_AUTH_PASSWORD: "${METATRACER_AUTH_PASSWORD:-}"
      METATRACER_SESSION_TTL_SECONDS: "${METATRACER_SESSION_TTL_SECONDS:-43200}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Web V2 (Next.js). UI shell only: no scan secrets, no LLM key, no database.
  # It reaches the API through the same origin (/api/*), so METATRACER_API_ORIGIN
  # is the internal service name and `/api` never leaves the compose network.
  web-v2:
    build:
      context: ./web
    image: metatracer-web-v2:0.6.0
    expose:
      - "3000"
    environment:
      METATRACER_API_ORIGIN: "http://web:8000"
      NODE_ENV: "production"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started

  # Single public entrypoint (T10, option B): routes by path, keeps one origin.
  proxy:
    image: caddy:2-alpine
    ports:
      - "8000:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - web
      - web-v2

  # Optional PostgreSQL + pgvector backend (TASK-23, Eje B):
  #   docker compose --profile postgres up
  # The app service (profile "default") stays on SQLite; to point MetaTracer
  # at Postgres set METATRACER_DATABASE_URL to the db service URL below, e.g.:
  #   docker compose --profile postgres up \
  #     -e METATRACER_DATABASE_URL=postgresql+asyncpg://metatracer:${POSTGRES_PASSWORD}@db:5432/metatracer
  # (or export it before running compose). The port is bound to the host's
  # loopback ONLY (the corpus is sensitive: GPS, emails, internal paths); the
  # app reaches the db over the compose internal network, not the host port.
  # POSTGRES_PASSWORD has no default: compose fails if it is unset.
  db:
    image: pgvector/pgvector:pg17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: metatracer
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: metatracer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metatracer -d metatracer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Headless watch (TASK-44). Off unless you pass --profile watch.
  # Replace METATRACER_WATCH_SCOPE with a saved scope id. Crontab is UTC.
  # The entrypoint already forwards unknown commands to the CLI.
  watch:
    build: .
    image: metatracer:0.6.0
    profiles: ["watch"]
    command:
      [
        "watch",
        "${METATRACER_WATCH_SCOPE:?METATRACER_WATCH_SCOPE is required}",
        "--cron",
        "${METATRACER_WATCH_CRON:-0 2 * * *}",
      ]
    environment:
      METATRACER_DATABASE_URL: "${METATRACER_DATABASE_URL:-sqlite+aiosqlite:///./data/metatracer.db}"
      METATRACER_LLM_API_KEY: "${METATRACER_LLM_API_KEY:-}"
      METATRACER_LLM_BASE_URL: "${METATRACER_LLM_BASE_URL:-}"
      METATRACER_LLM_MODEL: "${METATRACER_LLM_MODEL:-}"
      METATRACER_LOG_LEVEL: "${METATRACER_LOG_LEVEL:-INFO}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    # CLI watch does not serve /api/health (image HEALTHCHECK would go red).
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
