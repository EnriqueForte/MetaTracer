# MetaTracer local deployment (TASK-07, subtask 7.3.3): API + Web UI on :8000.
#
# METATRACER_ALLOW_LOOPBACK is a TEST-ONLY flag and is deliberately NOT set
# here — the container keeps the default safety posture (loopback/private
# targets blocked). Secrets arrive via the host environment, never baked in.
services:
  web:
    build: .
    image: metatracer:0.4.0
    command: ["web"]
    ports:
      - "8000:8000"
    environment:
      METATRACER_BIND_HOST: "0.0.0.0"
      METATRACER_LLM_API_KEY: "${METATRACER_LLM_API_KEY:-}"
      METATRACER_LLM_BASE_URL: "${METATRACER_LLM_BASE_URL:-}"
      METATRACER_LLM_MODEL: "${METATRACER_LLM_MODEL:-}"
      METATRACER_FAST_MODEL: "${METATRACER_FAST_MODEL:-}"
      METATRACER_LOG_LEVEL: "${METATRACER_LOG_LEVEL:-INFO}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  # Optional PostgreSQL + pgvector backend (TASK-23, Eje B):
  #   docker compose --profile postgres up
  # The app service (profile "default") stays on SQLite; to point MetaTracer
  # at Postgres set METATRACER_DATABASE_URL to the db service URL below, e.g.:
  #   docker compose --profile postgres up \
  #     -e METATRACER_DATABASE_URL=postgresql+asyncpg://metatracer:metatracer@db:5432/metatracer
  # (or export it before running compose). The port is bound to the host's
  # loopback ONLY (the corpus is sensitive: GPS, emails, internal paths); the
  # app reaches the db over the compose internal network, not the host port.
  # The password is a LOCAL default interpolated from the environment — set
  # POSTGRES_PASSWORD in any deployment that is not a disposable dev box.
  db:
    image: pgvector/pgvector:pg17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: metatracer
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-metatracer}"
      POSTGRES_DB: metatracer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metatracer -d metatracer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
