<!DOCTYPE html>
<!--
  Login page (TASK-24). Standalone ON PURPOSE: it does NOT extend base.html
  because the shared chrome starts the notifications bell, which polls the
  API on init — an anonymous visitor would get 401 on every page load (and,
  before the authFetch guard, redirect-loop /login -> bell -> 401 -> /login,
  observed live during validation). Same Tailwind CDN + CSS contract as the
  rest of the UI; no Alpine beyond the inline form component.
-->
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — MetaTracer</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/metatracer.css">
</head>
<body class="min-h-screen">
  <main id="main-content" class="max-w-md mx-auto w-full min-h-screen flex flex-col justify-center px-4 py-16 gap-4">
    <div class="mt-panel flex flex-col gap-4">
      <div>
        <p class="mt-meta">MetaTracer</p>
        <h1 class="mt-title">Sign in</h1>
        <p class="mt-body">MetaTracer control panel access.</p>
      </div>

      <div x-data="login_form" x-cloak class="flex flex-col gap-4">
        <div x-show="error" role="alert" class="mt-alert mt-alert-danger">
          <p x-text="error"></p>
        </div>

        <form @submit.prevent="submit()" class="flex flex-col gap-4">
          <div>
            <label for="username" class="mt-label">Username</label>
            <input id="username" name="username" type="text" required autocomplete="username"
                   x-model="username" class="mt-input">
          </div>
          <div>
            <label for="password" class="mt-label">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   x-model="password" class="mt-input">
          </div>
          <button type="submit" :disabled="busy" class="mt-btn mt-btn-primary w-full">
            <span x-show="!busy">Sign in</span>
            <span x-show="busy" x-cloak>Checking…</span>
          </button>
        </form>
      </div>
      {% if auth_enabled %}
      <p class="mt-meta">
        Have an invitation code?
        <a href="/register" class="underline text-[var(--mt-accent-hover)]">Create your account</a>
      </p>
      {% endif %}
    </div>
    <p class="mt-meta">
      Authentication protects the Web UI and API. The CLI on localhost does not require login.
    </p>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('login_form', () => ({
        username: '',
        password: '',
        busy: false,
        error: '',
        async submit() {
          this.busy = true;
          this.error = '';
          try {
            const response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                // Pre-session CSRF (double-submit): the page render set the
                // csrf_token cookie; echo it back in the header.
                'X-CSRF-Token': (document.querySelector('meta[name="csrf-token"]')?.getAttribute('content'))
                  || document.cookie.split('; ').find((c) => c.startsWith('csrf_token='))?.split('=')[1]
                  || '',
              },
              body: JSON.stringify({ username: this.username, password: this.password }),
            });
            if (response.ok) {
              window.location.href = '/';
              return;
            }
            this.error = response.status === 401
              ? 'Invalid username or password.'
              : response.status === 429
                ? 'Too many attempts; wait a moment and retry.'
                : 'Login failed (HTTP ' + response.status + ').';
          } catch (err) {
            this.error = 'Could not reach the server.';
          } finally {
            this.busy = false;
          }
        },
      }));
    });
  </script>
</body>
</html>
