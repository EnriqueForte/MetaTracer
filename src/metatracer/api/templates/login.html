{% extends "base.html" %}

{% block title %}Sign in — MetaTracer{% endblock %}

{% block content %}
<main id="main-content" class="max-w-md mx-auto px-4 py-16">
  <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-8">
    <h1 class="text-xl font-bold text-slate-100 mb-1">Sign in</h1>
    <p class="text-sm text-slate-400 mb-6">MetaTracer control panel access.</p>

    <div x-data="login_form" x-cloak>
      <div x-show="error" role="alert"
           class="bg-red-950/50 border border-red-800 rounded-lg p-3 mb-4">
        <p class="text-sm text-red-200" x-text="error"></p>
      </div>

      <form @submit.prevent="submit()" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username"
                 x-model="username"
                 class="w-full rounded-md bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-slate-200 focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 x-model="password"
                 class="w-full rounded-md bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-slate-200 focus:border-emerald-500 focus:outline-none">
        </div>
        <button type="submit" :disabled="busy"
                class="w-full rounded-md bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-3 py-2 text-sm font-semibold text-white">
          <span x-show="!busy">Sign in</span>
          <span x-show="busy" x-cloak>Checking…</span>
        </button>
      </form>
    </div>
  </div>
  <p class="text-xs text-slate-500 mt-4 text-center">
    Authentication protects the Web UI and API. The CLI on localhost does not require login.
  </p>
</main>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('login_form', () => ({
      username: '',
      password: '',
      busy: false,
      error: '',
      async submit() {
        this.busy = true;
        this.error = '';
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              // Pre-session CSRF (double-submit): the page render set the
              // csrf_token cookie; echo it back in the header.
              'X-CSRF-Token': (document.querySelector('meta[name="csrf-token"]')?.getAttribute('content'))
                || document.cookie.split('; ').find((c) => c.startsWith('csrf_token='))?.split('=')[1]
                || '',
            },
            body: JSON.stringify({ username: this.username, password: this.password }),
          });
          if (response.ok) {
            window.location.href = '/';
            return;
          }
          this.error = response.status === 401
            ? 'Invalid username or password.'
            : 'Login failed (HTTP ' + response.status + ').';
        } catch (err) {
          this.error = 'Could not reach the server.';
        } finally {
          this.busy = false;
        }
      },
    }));
  });
</script>
{% endblock %}
