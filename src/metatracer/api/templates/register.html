<!DOCTYPE html>
<!--
  Invitation-redeem page (TASK-25). Standalone ON PURPOSE, exactly like
  login.html: it does NOT extend base.html because the shared chrome starts
  the notifications bell, which polls the API on init — an anonymous visitor
  (registering is pre-session) would get 401 on every page load. Same
  vendored Tailwind stylesheet and Alpine file as the rest of the UI; no
  Alpine beyond the inline form.
-->
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account — MetaTracer</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/tailwind.css">
  <link rel="stylesheet" href="/static/metatracer.css">
  <script defer src="/static/alpine-csp-3.17.4.min.js"></script>
</head>
<body class="min-h-screen">
  <main id="main-content" class="max-w-md mx-auto w-full min-h-screen flex flex-col justify-center px-4 py-16 gap-4">
    <div class="mt-panel flex flex-col gap-4">
      <div>
        <p class="mt-meta">MetaTracer</p>
        <h1 class="mt-title">Create your account</h1>
        <p class="mt-body">Redeem the invitation code you received.</p>
      </div>

      <div x-data="register_form" x-cloak class="flex flex-col gap-4">
        <div x-show="error" role="alert" class="mt-alert mt-alert-danger">
          <p x-text="error"></p>
        </div>

        <form @submit.prevent="submit()" class="flex flex-col gap-4">
          <div>
            <label for="code" class="mt-label">Invitation code</label>
            <input id="code" name="code" type="text" required autocomplete="off"
                   x-model="code" class="mt-input">
          </div>
          <div>
            <label for="username" class="mt-label">Username</label>
            <input id="username" name="username" type="text" required autocomplete="username"
                   x-model="username" class="mt-input">
          </div>
          <div>
            <label for="password" class="mt-label">Password</label>
            <input id="password" name="password" type="password" required autocomplete="new-password"
                   x-model="password" class="mt-input">
            <p class="mt-meta">Minimum 8 characters.</p>
          </div>
          <button type="submit" :disabled="busy" class="mt-btn mt-btn-primary w-full">
            <span x-show="!busy">Create account</span>
            <span x-show="busy" x-cloak>Creating account…</span>
          </button>
        </form>
      </div>
    </div>
    <p class="mt-meta">
      Have an account already?
      <a href="/login" class="underline text-[var(--mt-accent-hover)]">Back to sign in</a>
    </p>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('register_form', () => ({
        code: '',
        username: '',
        password: '',
        busy: false,
        error: '',
        async submit() {
          this.busy = true;
          this.error = '';
          try {
            const response = await fetch('/api/auth/register', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                // Pre-session CSRF (double-submit): the page render set the
                // csrf_token cookie; echo it back in the header.
                'X-CSRF-Token': (document.querySelector('meta[name="csrf-token"]')?.getAttribute('content'))
                  || document.cookie.split('; ').find((c) => c.startsWith('csrf_token='))?.split('=')[1]
                  || '',
              },
              body: JSON.stringify({
                code: this.code,
                username: this.username,
                password: this.password,
              }),
            });
            if (response.ok) {
              window.location.href = '/';
              return;
            }
            // 401 is deliberately GENERIC (TASK-25 contract): the response
            // never reveals whether the code was unknown, used or expired.
            this.error = response.status === 401
              ? 'Invalid, used or expired invitation code.'
              : response.status === 409
                ? 'That username is already taken.'
                : response.status === 422
                  ? 'Password must be at least 8 characters.'
                  : response.status === 403
                    ? 'CSRF check failed; reload the page and retry.'
                    : 'Registration failed (HTTP ' + response.status + ').';
          } catch (err) {
            this.error = 'Could not reach the server.';
          } finally {
            this.busy = false;
          }
        },
      }));
    });
  </script>
</body>
</html>
