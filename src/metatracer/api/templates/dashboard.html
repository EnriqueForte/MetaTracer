{% extends "base.html" %}
{% block title %}MetaTracer — Dashboard{% endblock %}
{% block content %}
<div x-data="dashboard" x-init="load()" class="max-w-6xl mx-auto">
  <div class="flex items-end justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-100 mb-1">Dashboard</h1>
      <p class="text-sm text-slate-400">
        Aggregated view of every scan stored in this installation.
      </p>
    </div>
    <a href="/" class="text-sm text-emerald-400 hover:text-emerald-300 font-medium">New scan</a>
  </div>

  <p x-show="loadError" x-cloak class="text-sm text-red-400">Could not load the dashboard data.</p>

  <template x-if="stats">
    <!-- KPI cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
        <p class="text-xs uppercase tracking-wide text-slate-500">Runs</p>
        <p class="text-2xl font-semibold text-slate-100" x-text="stats.runs.total"></p>
        <p class="text-xs text-slate-500"
           x-text="'completed ' + statusCount('completed') + ' · failed ' + statusCount('failed')"></p>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
        <p class="text-xs uppercase tracking-wide text-slate-500">Findings</p>
        <p class="text-2xl font-semibold text-emerald-400" x-text="stats.findings.total"></p>
        <p class="text-xs text-slate-500" x-text="'unclassified ' + stats.findings.unclassified"></p>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
        <p class="text-xs uppercase tracking-wide text-slate-500">Assets</p>
        <p class="text-2xl font-semibold text-slate-100" x-text="stats.assets.total"></p>
        <p class="text-xs text-slate-500" x-text="'with issues ' + stats.assets.with_issues"></p>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
        <p class="text-xs uppercase tracking-wide text-slate-500">Scope domains</p>
        <p class="text-2xl font-semibold text-slate-100" x-text="stats.top_domains.length"></p>
        <p class="text-xs text-slate-500">most frequent</p>
      </div>
    </div>

    <!-- Severity breakdown -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-5">
        <h2 class="text-sm font-semibold text-slate-300 mb-4">Severity</h2>
        <template x-for="sev in severityOrder" :key="sev">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs text-slate-400 uppercase" x-text="sev"></span>
            <span class="text-xs text-slate-500" x-text="severityCount(sev)"></span>
          </div>
          <div class="severity-bar w-full"
                :style="'width:' + severityWidth(sev) + '%'"></div>
        </template>
        <p class="text-xs text-slate-500 mt-3"
           x-text="'unclassified: ' + severityCount('unclassified')"></p>
      </div>

      <!-- Findings by type -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-5">
        <h2 class="text-sm font-semibold text-slate-300 mb-4">Findings by type</h2>
        <div class="flex flex-wrap gap-2">
          <template x-for="type in typeOptions" :key="type.value">
            <span class="px-2 py-1 rounded-full text-xs font-semibold border border-emerald-700 text-emerald-300"
                  x-text="type.label + ' ' + type.count"></span>
          </template>
        </div>
      </div>
    </div>

    <!-- Top domains -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-5 mb-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-4">Top domains</h2>
      <table class="min-w-full text-sm">
        <thead class="border-b border-slate-800 text-left text-xs uppercase tracking-wide text-slate-500">
          <tr>
            <th class="px-4 py-2">Domain</th>
            <th class="px-4 py-2">Mentions</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="entry in stats.top_domains" :key="entry.domain">
            <tr class="border-b border-slate-800/60">
              <td class="px-4 py-2 font-mono text-xs text-emerald-400 break-all" x-text="entry.domain"></td>
              <td class="px-4 py-2 text-slate-300" x-text="entry.count"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <p x-show="stats.top_domains.length === 0" class="text-sm text-slate-500 mt-3">No scopes or assets scanned yet.</p>
    </div>

    <!-- Top evidence -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-5 mb-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-4">Most repeated evidence</h2>
      <table class="min-w-full text-sm">
        <thead class="border-b border-slate-800 text-left text-xs uppercase tracking-wide text-slate-500">
          <tr>
            <th class="px-4 py-2">Evidence</th>
            <th class="px-4 py-2">Type</th>
            <th class="px-4 py-2">Assets</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="entry in stats.top_evidence" :key="entry.signature">
            <tr class="border-b border-slate-800/60">
              <td class="px-4 py-2 font-mono text-xs text-slate-400 break-all" x-text="truncate(entry.evidence_snippet, 90)"></td>
              <td class="px-4 py-2 text-xs text-slate-500" x-text="entry.finding_type"></td>
              <td class="px-4 py-2 text-slate-300" x-text="entry.occurrences"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <p x-show="stats.top_evidence.length === 0" class="text-sm text-slate-500 mt-3">No findings yet.</p>
    </div>

    <!-- Agent usage -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-5">
      <h2 class="text-sm font-semibold text-slate-300 mb-4">Agent usage</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
          <p class="text-xs uppercase tracking-wide text-slate-500">Calls</p>
          <p class="text-lg font-semibold text-slate-100" x-text="stats.agent_usage.calls"></p>
        </div>
        <div>
          <p class="text-xs uppercase tracking-wide text-slate-500">Prompt tokens</p>
          <p class="text-lg font-semibold text-slate-100" x-text="stats.agent_usage.prompt_tokens"></p>
        </div>
        <div>
          <p class="text-xs uppercase tracking-wide text-slate-500">Completion tokens</p>
          <p class="text-lg font-semibold text-slate-100" x-text="stats.agent_usage.completion_tokens"></p>
        </div>
        <div>
          <p class="text-xs uppercase tracking-wide text-slate-500">Latency (ms)</p>
          <p class="text-lg font-semibold text-slate-100" x-text="stats.agent_usage.latency_ms"></p>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
document.addEventListener('alpine:init', () => {
  const TYPE_LABELS = {
    gps: 'GPS',
    email: 'Email',
    internal_path: 'Internal path',
    software_version: 'Software version',
    debug_comment: 'Debug comment',
  };
  Alpine.data('dashboard', () => ({
    stats: null,
    loadError: false,
    severityOrder: ['critical', 'high', 'medium', 'low', 'info'],

    async load() {
      try {
        const response = await fetch('/api/stats');
        if (!response.ok) { this.loadError = true; return; }
        this.stats = await response.json();
      } catch (err) {
        this.loadError = true;
      }
    },

    statusCount(status) {
      return this.stats ? (this.stats.runs[status] || 0) : 0;
    },

    severityCount(sev) {
      if (!this.stats) return 0;
      const bucket = this.stats.findings.severity_breakdown;
      return bucket ? (bucket[sev] || 0) : 0;
    },

    severityWidth(sev) {
      const total = this.severityCount(sev);
      if (total === 0) return 0;
      // A fixed denominator keeps the bars comparable across severities.
      return Math.min(100, Math.round((total / Math.max(1, this.stats.findings.total)) * 100));
    },

    get typeOptions() {
      if (!this.stats) return [];
      const breakdown = this.stats.findings.by_type || {};
      const order = ['gps', 'email', 'internal_path', 'software_version', 'debug_comment'];
      return order
        .filter((key) => breakdown[key])
        .map((key) => ({ value: key, label: TYPE_LABELS[key] || key, count: breakdown[key] }));
    },

    truncate(text, limit) {
      const collapsed = String(text || '').replace(/\s+/g, ' ').trim();
      return collapsed.length <= limit ? collapsed : collapsed.slice(0, limit - 3) + '...';
    },
  }));
});
</script>
{% endblock %}
