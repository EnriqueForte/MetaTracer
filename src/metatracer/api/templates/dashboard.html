{% extends "base.html" %}
{% block title %}MetaTracer — Dashboard{% endblock %}
{% block content %}
<div x-data="dashboard" x-init="load()" class="min-w-0 flex flex-col gap-6">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div class="min-w-0">
      <h1 class="mt-title">Dashboard</h1>
      <p class="mt-body">Aggregated view of every scan stored in this installation.</p>
    </div>
    <a href="/" class="mt-btn mt-btn-secondary">New scan</a>
  </div>

  <div x-show="!stats && !loadError" class="mt-loading" aria-live="polite">
    <span class="mt-spin" aria-hidden="true"></span>
    <span>Loading dashboard…</span>
  </div>

  <div x-show="loadError" x-cloak role="alert" class="mt-alert mt-alert-danger flex flex-wrap items-center justify-between gap-3">
    <p x-text="errorMessage || 'Could not load the dashboard data.'"></p>
    <button type="button" @click="load()" class="mt-btn mt-btn-secondary">Retry</button>
  </div>

  <template x-if="stats && stats.runs.total === 0">
    <div class="mt-panel mt-empty text-center flex flex-col items-center gap-2">
      <p class="mt-title" style="font-size:16px">No data yet</p>
      <p class="mt-body" style="color:var(--mt-muted)">
        Run a scan to start building the dashboard — runs, findings, domains and
        agent usage will appear here.
      </p>
      <a href="/" class="mt-btn mt-btn-secondary">New scan</a>
    </div>
  </template>

  <template x-if="stats && stats.runs.total > 0">
    <div class="flex flex-col gap-6">
      <div class="mt-panel">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="mt-kpi">
            <p class="mt-section">Runs</p>
            <p class="mt-kpi-value" x-text="stats.runs.total"></p>
            <p class="mt-meta"
               x-text="'Completed ' + statusCount('completed') + ' · Failed ' + statusCount('failed')"></p>
          </div>
          <div class="mt-kpi">
            <p class="mt-section">Findings</p>
            <p class="mt-kpi-value" x-text="stats.findings.total"></p>
            <p class="mt-meta" x-text="'Unclassified ' + stats.findings.unclassified"></p>
          </div>
          <div class="mt-kpi">
            <p class="mt-section">Assets</p>
            <p class="mt-kpi-value" x-text="stats.assets.total"></p>
            <p class="mt-meta" x-text="'With issues ' + stats.assets.with_issues"></p>
          </div>
          <div class="mt-kpi">
            <p class="mt-section">Total tokens</p>
            <p class="mt-kpi-value" x-text="stats.agent_usage.total_tokens"></p>
            <p class="mt-meta" x-text="stats.agent_usage.calls + ' calls'"></p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="mt-panel">
          <h2 class="mt-section mb-4">Severity</h2>
          <div class="flex flex-col gap-3">
            <template x-for="sev in severityOrder" :key="sev">
              <div class="flex flex-col gap-1">
                <div class="flex items-baseline justify-between gap-2">
                  <span class="mt-meta" x-text="severityLabel(sev)"></span>
                  <span class="mt-meta tabular-nums" x-text="severityCount(sev)"></span>
                </div>
                <div class="mt-sev-track" aria-hidden="true">
                  <div class="mt-sev-fill" :style="severityBarStyle(sev)"></div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="mt-panel">
          <h2 class="mt-section mb-4">Findings by type</h2>
          <div class="flex flex-wrap gap-2">
            <template x-for="type in typeOptions" :key="type.value">
              <span class="mt-badge mt-badge-confidence" x-text="type.label + ' ' + type.count"></span>
            </template>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <h2 class="mt-section">Top domains</h2>
        <div x-show="stats.top_domains.length > 0" class="mt-table-wrap">
          <table>
            <caption class="sr-only">Top domains by asset mentions</caption>
            <thead>
              <tr>
                <th class="mt-section" scope="col">Domain</th>
                <th class="mt-section" scope="col">Mentions</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="entry in stats.top_domains" :key="entry.domain">
                <tr>
                  <td class="mt-tech" x-text="entry.domain"></td>
                  <td class="text-right tabular-nums" x-text="entry.count"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p x-show="stats.top_domains.length === 0" class="mt-meta">No scopes or assets scanned yet.</p>
      </div>

      <div class="flex flex-col gap-3">
        <h2 class="mt-section">Most repeated evidence</h2>
        <div x-show="stats.top_evidence.length > 0" class="mt-table-wrap">
          <table>
            <caption class="sr-only">Most repeated evidence snippets</caption>
            <thead>
              <tr>
                <th class="mt-section" scope="col">Evidence</th>
                <th class="mt-section" scope="col">Type</th>
                <th class="mt-section" scope="col">Occurrences</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="entry in stats.top_evidence" :key="entry.signature">
                <tr>
                  <td class="mt-tech" x-text="truncate(entry.evidence_snippet, 90)"></td>
                  <td>
                    <span class="mt-badge mt-badge-confidence" x-text="typeLabel(entry.finding_type)"></span>
                  </td>
                  <td class="text-right tabular-nums" x-text="entry.occurrences"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p x-show="stats.top_evidence.length === 0" class="mt-meta">No findings yet.</p>
      </div>

      <div class="mt-panel">
        <h2 class="mt-section mb-4">Agent usage</h2>
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
          <div>
            <p class="mt-section">Calls</p>
            <p class="mt-kpi-value" x-text="stats.agent_usage.calls"></p>
          </div>
          <div>
            <p class="mt-section">Prompt tokens</p>
            <p class="mt-kpi-value" x-text="stats.agent_usage.prompt_tokens"></p>
          </div>
          <div>
            <p class="mt-section">Completion tokens</p>
            <p class="mt-kpi-value" x-text="stats.agent_usage.completion_tokens"></p>
          </div>
          <div>
            <p class="mt-section">Total tokens</p>
            <p class="mt-kpi-value" x-text="stats.agent_usage.total_tokens"></p>
          </div>
          <div>
            <p class="mt-section">Latency (ms)</p>
            <p class="mt-kpi-value" x-text="stats.agent_usage.latency_ms"></p>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
document.addEventListener('alpine:init', () => {
  const TYPE_LABELS = {
    gps: 'GPS',
    email: 'Email',
    internal_path: 'Internal path',
    software_version: 'Software version',
    debug_comment: 'Debug comment',
  };
  const SEVERITY_LABELS = {
    critical: 'Critical',
    high: 'High',
    medium: 'Medium',
    low: 'Low',
    info: 'Info',
    unclassified: 'Unclassified',
  };
  Alpine.data('dashboard', () => ({
    stats: null,
    loadError: false,
    errorMessage: '',
    severityOrder: ['critical', 'high', 'medium', 'low', 'info', 'unclassified'],

    async load() {
      this.loadError = false;
      try {
        const response = await fetch('/api/stats');
        if (!response.ok) {
          this.errorMessage = await this.readError(response);
          this.loadError = true;
          return;
        }
        this.stats = await response.json();
        this.errorMessage = '';
        this.loadError = false;
      } catch (err) {
        this.errorMessage = 'Network error: the API is unreachable.';
        this.loadError = true;
      }
    },
    async readError(response) {
      return window.MetaTracerUI.readError(
        response, 'Could not load the dashboard data (HTTP ' + response.status + ').'
      );
    },

    statusCount(status) {
      return this.stats ? (this.stats.runs[status] || 0) : 0;
    },

    severityCount(sev) {
      if (!this.stats) return 0;
      const bucket = this.stats.findings.severity_breakdown;
      return bucket ? (bucket[sev] || 0) : 0;
    },

    severityLabel(sev) {
      return SEVERITY_LABELS[sev] || sev;
    },

    severityWidth(sev) {
      const total = this.severityCount(sev);
      if (total === 0) return 0;
      // A fixed denominator keeps the bars comparable across severities.
      return Math.min(100, Math.round((total / Math.max(1, this.stats.findings.total)) * 100));
    },

    severityBarStyle(sev) {
      return 'width:' + this.severityWidth(sev) + '%;background:var(--mt-sev-' + sev + ')';
    },

    get typeOptions() {
      if (!this.stats) return [];
      const breakdown = this.stats.findings.by_type || {};
      const order = ['gps', 'email', 'internal_path', 'software_version', 'debug_comment'];
      return order
        .filter((key) => breakdown[key])
        .map((key) => ({ value: key, label: TYPE_LABELS[key] || key, count: breakdown[key] }));
    },

    typeLabel(value) {
      return TYPE_LABELS[value] || value;
    },

    truncate(text, limit) {
      return window.MetaTracerUI.truncate(text, limit);
    },
  }));
});
</script>
{% endblock %}
